]}, {"id": "s2", "title": "Лексика", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "Что означает 点 (diǎn) после числа?", "options": ["Час (о времени: 三点 = три часа)", "Минута (о времени)", "День (о дате)"], "correct": "Час (о времени: 三点 = три часа)", "explanation": "点 (diǎn) после числа означает «час»: 三点 (sān diǎn) — три часа, 八点 (bā diǎn) — восемь часов. Сам по себе иероглиф 点 значит «точка, капля».", "speak_text": "三点"}, {"id": "v2", "type": "choice", "sentence": "Как сказать «десять минут» по-китайски?", "options": ["十分 (shí fēn)", "十点 (shí diǎn)", "十块 (shí kuài)"], "correct": "十分 (shí fēn)", "explanation": "Минута — 分 (fēn), поэтому «десять минут» — 十分 (shí fēn). А 十点 (shí diǎn) — «десять часов», 十块 (shí kuài) — «десять юаней». Одинаковые числа, разные счётные слова!", "speak_text": "十分"}, {"id": "v3", "type": "choice", "sentence": "Сколько времени означает 两点半 (liǎng diǎn bàn)?", "options": ["2:30 (половина третьего)", "3:20 (двадцать минут четвёртого)", "12:30 (полдень)"], "correct": "2:30 (половина третьего)", "explanation": "两 (liǎng — два) + 点 (diǎn — час) + 半 (bàn — половина) = «два с половиной часа», то есть 2:30. Важно: с 点 для времени «два» — это 两, а не 二!", "speak_text": "两点半"}, {"id": "v4", "type": "choice", "sentence": "Как по-китайски сказать 4:45 (без пятнадцати пять)?", "options": ["差一刻五点 (chà yī kè wǔ diǎn)", "四点半 (sì diǎn bàn)", "五点一刻 (wǔ diǎn yī kè)"], "correct": "差一刻五点 (chà yī kè wǔ diǎn)", "explanation": "差 (chà — не хватает) + 一刻 (yī kè — четверть) + 五点 (wǔ diǎn — пять): «не хватает четверти до пяти» = 4:45. 四点半 — 4:30, 五点一刻 — 5:15.", "speak_text": "差一刻五点"}]}, {"id": "s3", "title": "Иероглифы", "icon": "🔴", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Какой иероглиф означает «час» (после числа)?", "options": ["点", "分", "半"], "correct": "点", "explanation": "点 (diǎn) — «час» после числа. Внутри иероглифа видна 占 сверху и четыре «капли» 点 снизу — изначально «капля, точка». Пример: 现在几点? — Который час?", "speak_text": "点"}, {"id": "c2", "type": "choice", "sentence": "Какой иероглиф означает «минута»?", "options": ["分", "点", "刻"], "correct": "分", "explanation": "分 (fēn) — «минута», также «делить». Сверху 八 (bā — разделять), снизу 刀 (dāo — нож): «делить ножом» = делить, минута как доля часа. 七点二十分 (qī diǎn èr shí fēn) — 7:20.", "speak_text": "分"}, {"id": "c3", "type": "choice", "sentence": "Где здесь слово «половина» (как в «половине третьего»)?", "options": ["半", "百", "白"], "correct": "半", "explanation": "半 (bàn) — половина. Внимание, не путайте: 百 (bǎi — сто) и 白 (bái — белый) выглядят похоже! 半 = 八 + 刀 + 一 линия поперёк — «вторая половина чего-то разделённого». 一点半 (yī diǎn bàn) — 1:30.", "speak_text": "半"}]}, {"id": "s4", "title": "Повторение", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "r1", "type": "choice", "sentence": "Как спросить «Который сейчас час?» (из урока 11)?", "options": ["现在几点？ (xiàn zài jǐ diǎn)", "现在多少钱？ (xiàn zài duō shǎo qián)", "现在什么时间？ (xiàn zài shén me shí jiān)"], "correct": "现在几点？ (xiàn zài jǐ diǎn)", "explanation": "现在几点? (xiàn zài jǐ diǎn) — стандартный способ спросить время. Ответ: например, 现在五点 (xiàn zài wǔ diǎn) — сейчас пять часов.", "speak_text": "现在几点"}, {"id": "r2", "type": "choice", "sentence": "Вспомним числа. Что значит 五十 (wǔ shí)?", "options": ["50 (пятьдесят)", "15 (пятнадцать)", "5 (пять)"], "correct": "50 (пятьдесят)", "explanation": "五十 (wǔ shí) — «пять десятков» = 50. А 15 — это 十五 (shí wǔ). Числа важны для времени: 八点五十 (bā diǎn wǔ shí fēn) — 8:50.", "speak_text": "五十"}, {"id": "r3", "type": "choice", "sentence": "Что означает 什么时候 (shén me shí hòu) из урока 11?", "options": ["Когда?", "Где?", "Сколько стоит?"], "correct": "Когда?", "explanation": "什么时候 (shén me shí hòu) — когда? Теперь можно комбинировать: 你什么时候去? — Когда ты идёшь? Ответ: 三点 (sān diǎn) — в три часа.", "speak_text": "什么时候"}]}, {"id": "s5", "title": "Practical", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "Вы в Китае, автобус на Великом стене отправляется в 8:30. Как сказать «Автобус отправляется в половине девятого»?", "options": ["公共汽车八点半出发。 (gōng gòng qì chē bā diǎn bàn chū fā)", "公共汽车八点一刻出发。 (gōng gòng qì chē bā diǎn yī kè chū fā)", "公共汽车差一刻八点出发。 (gōng gòng qì chē chà yī kè bā diǎn chū fā)"], "correct": "公共汽车八点半出发。 (gōng gòng qì chē bā diǎn bàn chū fā)", "explanation": "公共汽车 (gōng gòng qì chē) — автобус, 八点半 (bā diǎn bàn) — 8:30, 出发 (chū fā) — отправляться. 八点一刻 — 8:15, 差一刻八点 — 7:45.", "speak_text": "公共汽车八点半出发"}, {"id": "p2", "type": "choice", "sentence": "Вы спрашиваете у прохожего Li, во сколько открывается музей. Он отвечает: 九点开门 (jiǔ diǎn kāi mén). Во сколько открывается музей?", "options": ["В 9:00 (девять часов)", "В 9:30 (половина десятого)", "В 19:00 (семь вечера)"], "correct": "В 9:00 (девять часов)", "explanation": "九 (jiǔ) — девять, 点 (diǎn) — час, 开门 (kāi mén) — «открывать дверь», то есть открываться. 九点开门 = открывается в 9:00. Если бы было 九点半 — то в 9:30.", "speak_text": "九点开门"}]}, {"id": "s6", "title": "Перевод", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "tr1", "type": "choice", "sentence": "Как сказать по-китайски «Сейчас 7:20»?", "options": ["现在七点二十分。 (xiàn zài qī diǎn èr shí fēn)", "现在七点二分。 (xiàn zài qī diǎn èr fēn)", "现在二十点七分。 (xiàn zài èr shí diǎn qī fēn)"], "correct": "现在七点二十分。 (xiàn zài qī diǎn èr shí fēn)", "explanation": "Порядок всегда такой: ЧАСЫ + 点 + МИНУТЫ + 分. 七点 (qī diǎn) — 7 часов, 二十分 (èr shí fēn) — 20 минут. Итого: 七点二十分 — 7:20.", "speak_text": "现在七点二十分"}, {"id": "tr2", "type": "choice", "sentence": "Переведите на русский: 我们的火车六点出发。 (wǒ men de huǒ chē liù diǎn chū fā)", "options": ["Наш поезд отправляется в шесть часов.", "Наш поезд отправляется в шесть минут.", "Наш поезд стоит шестьдесят юаней."], "correct": "Наш поезд отправляется в шесть часов.", "explanation": "我们 (wǒ men) — мы/наш, 火车 (huǒ chē) — поезд, 六点 (liù diǎn) — шесть часов, 出发 (chū fā) — отправляться. «Наш поезд отправляется в 6:00.»", "speak_text": "我们的火车六点出发"}]}, {"id": "s7", "title": "Listening Practice", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Послушайте диалог и ответьте: что хочет узнать Ying?", "options": ["Который час (время)", "Сколько стоит билет", "Где вокзал"], "correct": "Который час (время)", "explanation": "Ying спрашивает: 现在几点? (xiàn zài jǐ diǎn) — Который сейчас час? Wang отвечает: 现在三点一刻 (xiàn zài sān diǎn yī kè) — Сейчас 3:15. Ying интересуется временем.", "audio_text": "Ying(F): Wang, 现在几点? Wang(M): 现在三点一刻。"}, {"id": "l2", "type": "listen", "sentence": "Послушайте диалог ещё раз: сколько времени назвал Wang?", "options": ["3:15 (три часа пятнадцать минут)", "3:30 (половина четвёртого)", "3:00 (ровно три часа)"], "correct": "3:15 (три часа пятнадцать минут)", "explanation": "Wang сказал: 三点一刻 (sān diǎn yī kè). 三点 — три часа, 一刻 — четверть (15 минут). Итого 3:15. Если бы 三点半 — было бы 3:30.", "audio_text": "Ying(F): Wang, 现在几点? Wang(M): 现在三点一刻。"}]}]};
let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function renderAll() {
  const c = document.getElementById('quizContent'); c.innerHTML = ''; let gq = 0;
  sectionData.forEach(sec => {
    let h = '<div class="section-card" id="section_' + sec.id + '">';
    h += '<div class="section-title"><span class="icon">' + (sec.icon||'📝') + '</span>' + esc(sec.title) + '</div>';
    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles: show hanzi + pinyin
      var subLines = secAudioTexts[0] || '';
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.hanzi) + '</div>';
          h += '<div class="sub-pinyin">' + esc(sl.pinyin) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) {
        h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
        // Mini speak button for questions that contain Chinese characters
        var cnChars = q.sentence.match(/[\u4e00-\u9fff]/g);
        if (cnChars || q.speak_text) {
          var speakText = q.speak_text || q.sentence.replace(/___+/g,'');
          h += '<button class="mini-speak" data-speak="' + esc(speakText) + '" onclick="speakCNFromBtn(this)">🔊 Послушать</button>';
        }
      }
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function speakCNFromBtn(btn) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  var text = btn.dataset.speak || '';
  var cnText = (text.match(/[\u4e00-\u9fff\uff0c\u3002\uff01\uff1f]+/g) || []).join('');
  if (!cnText) cnText = text;
  var u = new SpeechSynthesisUtterance(cnText);
  u.lang = 'zh-CN'; u.rate = 0.8;
  var voices = window.speechSynthesis.getVoices();
  var zhVoice = voices.find(function(v) { return v.lang.startsWith('zh'); });
  if (zhVoice) u.voice = zhVoice;
  u.onend = function() { btn.style.opacity = '1'; };
  u.onerror = function() { btn.style.opacity = '1'; };
  btn.style.opacity = '0.5';
  window.speechSynthesis.speak(u);
}

function toggleSubs(el) {
  var body = el.parentElement.querySelector('.sub-body');
  if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
init();
</script>
</body>
